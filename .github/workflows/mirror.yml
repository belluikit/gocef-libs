# Mirror a CEF build: fetch, verify, strip, repack, publish.
#
# This is the CVE-response mechanism (belluikit/bellui#98). It runs under time
# pressure when Chromium ships a security fix, so it is one dispatch with one
# input and no manual steps — anything that needs remembering will be forgotten
# at the wrong moment.
#
# The heavy lifting is the strip: CEF's Release libcef.so ships at ~1.36 GB and
# is ~256 MiB stripped. That 81% is what makes the payload shippable at all.
name: Mirror

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: "CEF version to mirror, e.g. 151.3.12+gd9cea67+chromium-151.0.7922.47"
        required: true
      publish:
        description: "Publish a release (otherwise build and check only)"
        type: boolean
        default: false

permissions:
  contents: write # to create the release

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux64
            strip: llvm-strip
          - platform: linuxarm64
            strip: llvm-strip
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The extracted distribution is ~1.4 GB and a hosted runner starts with
        # ~14 GB free, which is enough — but not with the preinstalled Android
        # SDK and .NET images sitting there.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h / | tail -1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          # libc6-dev-arm64-cross is not optional: gcc-aarch64-linux-gnu alone
          # has no target libc headers, and with --no-install-recommends it is
          # not pulled in — the helper then fails on bits/wordsize.h.
          # brotli decodes Chromium's credits page out of resources.pak
          # (scripts/extract_credits.py); Python's stdlib has no brotli.
          sudo apt-get install -y --no-install-recommends \
            llvm zstd brotli gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Fetch and verify upstream
        env:
          VERSION: ${{ inputs.cef_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          encoded="${VERSION//+/%2B}"
          url="https://cef-builds.spotifycdn.com/cef_binary_${encoded}_${PLATFORM}_minimal.tar.bz2"
          echo "fetching $url"
          curl -fSL --retry 3 -o upstream.tar.bz2 "$url"

          # Check against CEF's own build index rather than a value pasted into
          # this file: the point is to prove we mirrored what upstream published,
          # and a hash we typed ourselves proves nothing.
          curl -fSL -o index.json "https://cef-builds.spotifycdn.com/index.json"
          expected=$(python3 - "$VERSION" "$PLATFORM" <<'PY'
          import json, sys
          version, platform = sys.argv[1], sys.argv[2]
          idx = json.load(open("index.json"))
          for v in idx[platform]["versions"]:
              if v["cef_version"] == version:
                  for f in v["files"]:
                      if f["type"] == "minimal":
                          print(f["sha1"]); sys.exit(0)
          sys.exit("no minimal build for %s on %s" % (version, platform))
          PY
          )
          actual=$(sha1sum upstream.tar.bz2 | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "upstream checksum mismatch: index says $expected, download is $actual" >&2
            exit 1
          fi
          echo "upstream sha1 verified: $actual"

      - name: Unpack, strip and lay out
        env:
          VERSION: ${{ inputs.cef_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p work payload
          tar -xjf upstream.tar.bz2 -C work
          dist="work/cef_binary_${VERSION}_${PLATFORM}_minimal"

          echo "libcef.so unstripped: $(du -h "$dist/Release/libcef.so" | cut -f1)"
          cp "$dist/Release/libcef.so" payload/libcef.so
          ${{ matrix.strip }} --strip-all payload/libcef.so
          echo "libcef.so stripped:   $(du -h payload/libcef.so | cut -f1)"

          # The rest of Release/: the Vulkan loader, SwiftShader (the software
          # fallback for a machine with no usable GPU), and the V8 snapshot
          # blobs — which are the one part of the runtime NOT under Resources/,
          # and whose absence fails as "Error loading V8 startup snapshot file".
          for f in libvk_swiftshader.so libvulkan.so.1 libEGL.so libGLESv2.so \
                   snapshot_blob.bin v8_context_snapshot.bin vk_swiftshader_icd.json; do
            [ -f "$dist/Release/$f" ] && cp "$dist/Release/$f" payload/ || true
          done

          # Strip the other shared libraries too, not just libcef.so. This is
          # not a rounding error: libvk_swiftshader.so ships at 99 MB on arm64
          # against 14 MB on x64, and that one file was the whole of an
          # otherwise unexplained 88 MB difference between the two payloads.
          # --strip-all removes .symtab and leaves .dynsym, so dynamic linking
          # is unaffected.
          for so in payload/*.so payload/*.so.1; do
            [ -f "$so" ] || continue
            before=$(stat -c%s "$so")
            ${{ matrix.strip }} --strip-all "$so" || true
            after=$(stat -c%s "$so")
            [ "$before" != "$after" ] && \
              echo "stripped $(basename "$so"): $((before/1048576)) -> $((after/1048576)) MB"
          done
          [ -f "$dist/Release/chrome-sandbox" ] && cp "$dist/Release/chrome-sandbox" payload/ || true

          # Resources go FLAT, beside libcef.so. CEF's own distribution nests
          # them under Resources/ and its CMake copies them next to the binary,
          # because that is where Chromium looks — a nested copy fails inside
          # ICU with "Invalid file descriptor to ICU data received".
          #
          # Locales are shipped whole (~48 MB). Trimming belongs to whoever
          # packages an application, because only they know which locales it
          # offers; dropping them here would be guessing on someone else's
          # behalf.
          cp -r "$dist/Resources/." payload/

          # The subprocess helper, built for the target. It is prebuilt here so
          # `bellui package` does not need a C toolchain.
          case "$PLATFORM" in
            linux64)    cc="cc" ;;
            linuxarm64) cc="aarch64-linux-gnu-gcc" ;;
          esac
          $cc -O2 -I "$dist" -DCEF_API_VERSION=13300 -o payload/cef_helper helper/helper.c -ldl

          cp "$dist/LICENSE.txt" payload/LICENSE.cef.txt

          # Chromium's third-party notices. CEF's LICENSE.txt covers CEF only;
          # the licences of everything Chromium bundles (FFmpeg, ICU, libvpx,
          # BoringSSL, ... several hundred projects, some LGPL) exist in the
          # distribution only as the about:credits page compressed inside
          # resources.pak. Extract it so the notices travel with the binaries.
          # The script fails unless it finds exactly one credits page, so a
          # Chromium change breaks the mirror instead of shipping without it.
          python3 -I scripts/extract_credits.py payload/resources.pak payload/CREDITS.html
          # CEF's own README, which describes the distribution and its
          # licensing, when the distribution has one.
          [ -f "$dist/README.txt" ] && cp "$dist/README.txt" payload/README.cef.txt || true

          # Report what is actually being shipped. Anyone bumping CEF should be
          # able to see the composition change without unpacking anything, and
          # an unexplained jump is a reason to look before publishing.
          # Written to a file rather than piped into head: under `set -o
          # pipefail`, head exiting early gives sort an EPIPE and fails the
          # whole step, which is exactly what happened the first time this ran.
          echo "payload total: $(du -sh payload | cut -f1)"
          find payload -type f -printf '%s\t%P\n' | sort -rn > /tmp/sizes.txt
          echo "largest files:"
          awk -F'\t' 'NR<=12 {printf "  %8.1f MB  %s\n", $1/1048576, $2}' /tmp/sizes.txt
          echo "locales/: $(du -sh payload/locales 2>/dev/null | cut -f1)"

      - name: Pack and hash
        env:
          VERSION: ${{ inputs.cef_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          name="cef-${VERSION}-${PLATFORM}.tar.zst"
          # Deterministic: fixed order, fixed timestamps, no ownership. Without
          # these, tar records filesystem order and mtimes, so two mirrors of
          # the same upstream build hash differently and the checksum only
          # proves "this is the file we happened to produce".
          #
          # With them, anyone can re-run this workflow on the same CEF version
          # and get the identical hash — which is what turns the manifest's
          # SHA-256 from "trust us" into something independently checkable. For
          # a repository whose whole job is redistributing someone else's
          # browser engine, that is worth the four flags.
          tar --zstd --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "$name" -C payload .
          sha256sum "$name" | tee "$name.sha256"
          ls -lh "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.cef_version }}
        run: |
          set -euo pipefail
          tag="cef-${VERSION}"

          # Create idempotently rather than check-then-create. The matrix runs
          # one job per architecture concurrently, and both used to see "no
          # release", both try to create it, and the loser takes an HTTP 422 —
          # which is exactly how the first publish left a release carrying only
          # one of the two payloads.
          gh release create "$tag" --title "$tag" \
            --notes "CEF $VERSION mirrored from cef-builds.spotifycdn.com. Upstream checksum verified; every shipped library stripped; tarball reproducible. See manifest/ for the pin." \
            2>/dev/null || true

          # Whoever lost the race must still find the release before uploading,
          # so a genuine failure is not mistaken for a lost race.
          gh release view "$tag" >/dev/null

          gh release upload "$tag" "$ASSET" "$ASSET.sha256" --clobber

      - name: Report the hash for the manifest
        run: |
          echo "Add to manifest/manifest.go for ${{ matrix.platform }}:"
          cut -d' ' -f1 "$ASSET.sha256"
